<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LowkeyDevs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Syncopate:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #F8F8F8;
            --text-primary: #000000;
            --text-secondary: #555555;
            --font-heading: 'Syncopate', 'Horizon', sans-serif;
            --font-body: 'Poppins', sans-serif;
            --nav-height: 80px;
            --transition-smooth: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-fast: 0.3s ease;
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-body);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Background Effects */
        .bg-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .animated-grid {
            position: absolute;
            width: 200vw;
            height: 200vh;
            top: -50%;
            left: -50%;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 20s linear infinite;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: float 10s ease-in-out infinite;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: rgba(200, 200, 200, 0.4);
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: rgba(180, 180, 180, 0.3);
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--nav-height);
            display: flex;
            align-items: center;
            padding: 0 5%;
            z-index: 100;
            background: rgba(248, 248, 248, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.03);
            transition: var(--transition-fast);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.25rem;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .nav-logo svg {
            width: 32px;
            height: 32px;
        }

        /* Main Container */
        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(var(--nav-height) + 2rem) 5% 2rem;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        /* Sections */
        .section {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
            opacity: 1;
            transition: opacity var(--transition-smooth), transform var(--transition-smooth);
        }

        .section.hidden {
            position: absolute;
            opacity: 0;
            transform: translateY(30px);
            pointer-events: none;
            visibility: hidden;
        }

        /* Hero Left */
        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .title {
            font-family: var(--font-heading);
            font-size: clamp(3rem, 7vw, 6rem);
            line-height: 0.9;
            text-transform: uppercase;
            letter-spacing: -2px;
            color: var(--text-primary);
        }

        .tagline {
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .btn {
            position: relative;
            padding: 1rem 2rem;
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            border: none;
            outline: none;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn:focus-visible {
            box-shadow: 0 0 0 3px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background-color: var(--text-primary);
            color: #fff;
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -5px rgba(0,0,0,0.4);
            background-color: #222;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid rgba(0,0,0,0.1);
            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            border-color: rgba(0,0,0,0.3);
            background-color: rgba(0,0,0,0.03);
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            pointer-events: none;
        }
        
        .btn-secondary .ripple {
            background: rgba(0, 0, 0, 0.1);
        }

        /* Hero Right */
        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            animation: fadeIn 1.5s ease forwards;
            opacity: 0;
        }

        .logo-wrapper {
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatingSvg 6s ease-in-out infinite;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .logo-wrapper svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.1));
        }

        /* Ask Section */
        #ask-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 60vh;
        }

        .ask-title {
            font-family: var(--font-heading);
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .link-hover {
            position: relative;
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            display: inline-block;
            cursor: pointer;
            padding-bottom: 4px;
        }

        .link-hover::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--text-primary);
            transform-origin: bottom right;
            transition: transform 0.3s cubic-bezier(0.86, 0, 0.07, 1);
        }

        .link-hover:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            color: white;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        /* Keyframes */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes floatingSvg {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-15px) rotate(1deg); }
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px); }
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .section {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 2rem;
            }
            .hero-content {
                align-items: center;
            }
            .btn-group {
                justify-content: center;
            }
            .logo-wrapper {
                max-width: 350px;
            }
        }

        @media (max-width: 576px) {
            .btn-group {
                flex-direction: column;
                width: 100%;
            }
            .btn {
                width: 100%;
            }
            .toast {
                width: 90%;
                text-align: center;
                justify-content: center;
                bottom: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-elements">
        <div class="animated-grid"></div>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav>
        <div class="nav-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="404.5 8 700 700">
                <path fill="#000" d="M805.37656,331.90924l46.56651,-80.65556l59.03204,-102.24649l59.03204,102.24649l46.56652,80.65557l17.26816,29.90933h-34.53631h-40.51922l-47.81118,-82.81139l-47.81118,82.81139h-40.5192h-34.53633z"/>
                <path fill="#000" d="M970.00415,487.71901l-59.02917,83.97208l-59.02917,-83.97208l-46.56795,-66.24535l-17.26959,-24.5669h34.53918h40.51348l47.81405,68.01799l47.81405,-68.01799h40.51346h34.5392l-17.2696,24.56691z"/>
                <path fill="#000" d="M627.53958,466.12421l48.65722,-69.21745h40.51633h34.5392l-17.2696,24.56691l-31.38762,44.65054l-89.3898,127.16167l-89.3898,-127.16167l-31.38763,-44.65055l-17.26959,-24.5669h34.53918h40.51635l48.65722,69.21745l14.33427,20.39125z"/>
                <path fill="#000" d="M627.53948,277.5418l-14.33427,-24.82768l-14.33427,24.82768l-48.65723,84.27679h-40.51633h-34.5392l17.2696,-29.91183l31.38762,-54.36496l89.3898,-154.82768l89.3898,154.82768l31.38763,54.36498l17.26959,29.91181h-34.53918h-40.51635z"/>
            </svg>
            LowkeyDevs
        </div>
    </nav>

    <main class="container">
        
        <section id="hero-section" class="section">
            <div class="hero-content">
                <h1 class="title">LOWKEY<br>DEVS<br>.COM</h1>
                <p class="tagline">We do rain of softwares ;)</p>
                <div class="btn-group">
                    <button class="btn btn-primary" id="btn-search">Search Tools</button>
                    <button class="btn btn-secondary" id="btn-getnew">Get New</button>
                </div>
            </div>
            
            <div class="hero-visual">
                <div class="logo-wrapper" id="parallax-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="404.5 8 700 700">
                        <path fill="#000" d="M805.37656,331.90924l46.56651,-80.65556l59.03204,-102.24649l59.03204,102.24649l46.56652,80.65557l17.26816,29.90933h-34.53631h-40.51922l-47.81118,-82.81139l-47.81118,82.81139h-40.5192h-34.53633z"/>
                        <path fill="#000" d="M970.00415,487.71901l-59.02917,83.97208l-59.02917,-83.97208l-46.56795,-66.24535l-17.26959,-24.5669h34.53918h40.51348l47.81405,68.01799l47.81405,-68.01799h40.51346h34.5392l-17.2696,24.56691z"/>
                        <path fill="#000" d="M627.53958,466.12421l48.65722,-69.21745h40.51633h34.5392l-17.2696,24.56691l-31.38762,44.65054l-89.3898,127.16167l-89.3898,-127.16167l-31.38763,-44.65055l-17.26959,-24.5669h34.53918h40.51635l48.65722,69.21745l14.33427,20.39125z"/>
                        <path fill="#000" d="M627.53948,277.5418l-14.33427,-24.82768l-14.33427,24.82768l-48.65723,84.27679h-40.51633h-34.5392l17.2696,-29.91183l31.38762,-54.36496l89.3898,-154.82768l89.3898,154.82768l31.38763,54.36498l17.26959,29.91181h-34.53918h-40.51635z"/>
                    </svg>
                </div>
            </div>
        </section>

        <section id="ask-section" class="section hidden">
            <div>
                <h2 class="ask-title">Ask Aashu<br>The Dev</h2>
                <a class="link-hover" id="btn-back">← Back to home</a>
            </div>
        </section>

    </main>

    <div id="toast" class="toast">
        🚀 Coming Soon. We're building something awesome.
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Elements
            const heroSection = document.getElementById('hero-section');
            const askSection = document.getElementById('ask-section');
            const btnSearch = document.getElementById('btn-search');
            const btnGetNew = document.getElementById('btn-getnew');
            const btnBack = document.getElementById('btn-back');
            const toast = document.getElementById('toast');
            const parallaxLogo = document.getElementById('parallax-logo');
            
            let toastTimeout;

            // Ripple Effect Function
            function createRipple(event) {
                const button = event.currentTarget;
                const circle = document.createElement('span');
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;

                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${event.clientX - button.getBoundingClientRect().left - radius}px`;
                circle.style.top = `${event.clientY - button.getBoundingClientRect().top - radius}px`;
                circle.classList.add('ripple');

                const ripple = button.querySelector('.ripple');
                if (ripple) {
                    ripple.remove();
                }
                button.appendChild(circle);
            }

            // Apply ripple to buttons
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => btn.addEventListener('click', createRipple));

            // Toast Logic
            btnSearch.addEventListener('click', () => {
                clearTimeout(toastTimeout);
                toast.classList.add('show');
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            });

            // Section Transitions
            function switchSection(hideElem, showElem) {
                hideElem.classList.add('hidden');
                setTimeout(() => {
                    hideElem.style.display = 'none';
                    // Determine correct layout dynamically or stick to a designated one
                    showElem.style.display = showElem.id === 'ask-section' ? 'flex' : 'grid';
                    
                    // Force reflow
                    void showElem.offsetWidth;
                    
                    showElem.classList.remove('hidden');
                }, 600); // Wait for transition
            }

            btnGetNew.addEventListener('click', () => {
                switchSection(heroSection, askSection);
            });

            btnBack.addEventListener('click', () => {
                switchSection(askSection, heroSection);
            });

            // Mouse Parallax Effect
            document.addEventListener('mousemove', (e) => {
                // Only run parallax on desktop sizes
                if (window.innerWidth > 992 && !heroSection.classList.contains('hidden')) {
                    const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
                    const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
                    parallaxLogo.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
                }
            });

            // Reset parallax on mouse leave
            document.addEventListener('mouseleave', () => {
                parallaxLogo.style.transform = `rotateY(0deg) rotateX(0deg)`;
            });
        });
    </script>
</body>
</html>
